<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка | Le Bistro</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #c7a252;
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
        }
        button {
            background: #c7a252;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .error {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }
        .panel {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loginBox" class="login-box">
        <h2>🔐 Вход в админку</h2>
        <input type="password" id="passwordInput" placeholder="Введите пароль">
        <div id="errorMsg" class="error">Неверный пароль</div>
        <button id="loginBtn">Войти</button>
    </div>

    <div id="adminPanel" class="panel">
        <h1>✅ Добро пожаловать, админ!</h1>
        <p>Здесь будет управление пользователями и бронями.</p>
        <button id="logoutBtn">Выйти</button>
    </div>

    <script>
        // ПАРОЛЬ (можешь поменять на любой)
        const ADMIN_PASSWORD = 'Xk9#mP2$vL7@qR4!wN6&';

        const loginBox = document.getElementById('loginBox');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const errorMsg = document.getElementById('errorMsg');

        function handleLogin() {
            const password = passwordInput.value;
            if (password === ADMIN_PASSWORD) {
                loginBox.style.display = 'none';
                adminPanel.style.display = 'block';
                sessionStorage.setItem('adminLoggedIn', 'true');
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
            }
        }

        function handleLogout() {
            loginBox.style.display = 'block';
            adminPanel.style.display = 'none';
            sessionStorage.removeItem('adminLoggedIn');
            passwordInput.value = '';
        }

        loginBtn.onclick = handleLogin;
        logoutBtn.onclick = handleLogout;
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // Проверяем, не заходил ли уже админ
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            loginBox.style.display = 'none';
            adminPanel.style.display = 'block';
        }
    </script>
</body>
</html>
