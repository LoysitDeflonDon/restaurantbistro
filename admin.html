<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка | Le Bistro</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
        .login-box, .panel { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #c7a252; max-width: 400px; margin: 0 auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; }
        button { background: #c7a252; color: black; border: none; padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .error { color: #ff4444; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1a1a1a; border-radius: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.2rem; margin: 0 3px; }
        .stats { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .stat-card { background: #1a1a1a; padding: 10px 20px; border-radius: 15px; }
    </style>
</head>
<body>

<div id="loginBox" class="login-box">
    <h2>🔐 Админка</h2>
    <input type="password" id="adminPassword" placeholder="Пароль">
    <div id="errorMsg" class="error">Неверный пароль</div>
    <button id="loginBtn">Войти</button>
</div>

<div id="adminPanel" class="panel" style="display:none; max-width: 1200px;">
    <h2>👑 Управление</h2>
    <div class="stats">
        <div class="stat-card"><span id="statUsers">0</span> пользователей</div>
        <div class="stat-card"><span id="statBlocked">0</span> заблокировано</div>
        <div class="stat-card"><span id="statBookings">0</span> броней</div>
    </div>
    <h3>👥 Пользователи</h3>
    <div id="usersList">Загрузка...</div>
    <h3>📅 Бронирования</h3>
    <div id="bookingsList">Загрузка...</div>
    <button id="logoutBtn">Выйти</button>
</div>

<script>
    // ========== ТВОИ ДАННЫЕ ==========
    const MASTER_KEY = '$2a$10$LX5oylJg7sUo03LV/.UGeeeJB8Qbq3FHt1N8uL9zvuzCCW4wDxNX.';
    const USERS_BIN_ID = '6a2f2c6eda38895dfec07f8a';
    const BOOKINGS_BIN_ID = '6a2f2c7bf5f4af5e29f20087';
    const ADMIN_PASSWORD = 'Xk9#mP2$vL7@qR4!wN6&';
    
    // ========== ЗАПРОСЫ К JSONBIN ==========
    async function fetchBin(binId) {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        const data = await res.json();
        if (data.record && data.record.users !== undefined) return data.record.users;
        if (data.record && data.record.bookings !== undefined) return data.record.bookings;
        return data.record;
    }
    
    async function updateBin(binId, data) {
        let payload;
        if (binId === USERS_BIN_ID) payload = { users: data };
        else payload = { bookings: data };
        
        await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
            body: JSON.stringify(payload)
        });
    }
    
    // ========== ДЕЙСТВИЯ (ГЛОБАЛЬНЫЕ) ==========
    window.toggleBlockUser = async function(userId, currentStatus) {
        let users = await fetchBin(USERS_BIN_ID);
        const index = users.findIndex(u => u.id == userId);
        if (index !== -1) {
            users[index].blocked = !currentStatus;
            await updateBin(USERS_BIN_ID, users);
            await renderUsers();
        }
    };
    
    window.deleteUser = async function(userId) {
        if (!confirm('Удалить пользователя?')) return;
        let users = await fetchBin(USERS_BIN_ID);
        users = users.filter(u => u.id != userId);
        await updateBin(USERS_BIN_ID, users);
        await renderUsers();
        alert('Удалён');
    };
    
    window.deleteBooking = async function(bookingId) {
        if (!confirm('Удалить бронь?')) return;
        let bookings = await fetchBin(BOOKINGS_BIN_ID);
        bookings = bookings.filter(b => b.id != bookingId);
        await updateBin(BOOKINGS_BIN_ID, bookings);
        await renderBookings();
        alert('Бронь удалена');
    };
    
    // ========== ОТРИСОВКА ==========
    async function renderUsers() {
        let users = await fetchBin(USERS_BIN_ID) || [];
        document.getElementById('statUsers').innerText = users.length;
        document.getElementById('statBlocked').innerText = users.filter(u => u.blocked).length;
        
        if (users.length === 0) {
            document.getElementById('usersList').innerHTML = '<p>Нет пользователей</p>';
            return;
        }
        
        let html = '<table><tr><th>ID</th><th>Имя</th><th>Email</th><th>Телефон</th><th>Статус</th><th>Действия</th></tr>';
        for (let u of users) {
            html += `<tr>
                <td>${u.id}</td>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.phone}</td>
                <td>${u.blocked ? '🔴 Заблокирован' : '🟢 Активен'}</td>
                <td>
                    <button class="btn-icon" onclick="toggleBlockUser(${u.id}, ${!!u.blocked})">${u.blocked ? '🔓' : '🔨'}</button>
                    <button class="btn-icon delete" onclick="deleteUser(${u.id})">🗑️</button>
                </td>
            </tr>`;
        }
        html += '</table>';
        document.getElementById('usersList').innerHTML = html;
    }
    
    async function renderBookings() {
        let bookings = await fetchBin(BOOKINGS_BIN_ID) || [];
        document.getElementById('statBookings').innerText = bookings.length;
        
        if (bookings.length === 0) {
            document.getElementById('bookingsList').innerHTML = '<p>Нет броней</p>';
            return;
        }
        
        let html = '<table><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Дата</th><th>Время</th><th>Гостей</th><th>Действия</th></tr>';
        for (let b of bookings) {
            html += `<tr>
                <td>${b.id}</td>
                <td>${b.name}</td>
                <td>${b.phone}</td>
                <td>${b.date}</td>
                <td>${b.time}</td>
                <td>${b.guests}</td>
                <td><button class="btn-icon delete" onclick="deleteBooking(${b.id})">🗑️</button></td>
            </tr>`;
        }
        html += '</table>';
        document.getElementById('bookingsList').innerHTML = html;
    }
    
    // ========== ЛОГИН ==========
    document.getElementById('loginBtn').onclick = async function() {
        const pwd = document.getElementById('adminPassword').value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            await renderUsers();
            await renderBookings();
            sessionStorage.setItem('adminLoggedIn', 'true');
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    };
    
    document.getElementById('logoutBtn').onclick = function() {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        sessionStorage.removeItem('adminLoggedIn');
    };
    
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        renderUsers();
        renderBookings();
    }
</script>
</body>
</html>
